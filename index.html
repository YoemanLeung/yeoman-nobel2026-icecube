<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>冰立方 IceCube</title>
  <meta name="description" content="一部可以暂停、倒放和亲手接管的科学短片：一颗来自约 40 亿光年外的中微子，怎样在南极冰下一立方公里的探测器里留下光，又怎样被找回方向。" />
  <meta name="theme-color" content="#02070d" />
  <!-- self-hosted font subsets (web/_tools/fonts.py): no Google Fonts, which mainland China cannot reach -->
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three-r170/three.module.min.js",
        "three/addons/": "./vendor/three-r170/"
      }
    }
  </script>
</head>
<body>
  <div id="app" class="booting">
    <div id="gl"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="fade" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <div id="flyRoot" aria-hidden="true"></div>
    <div id="scaleLabel" aria-live="polite"></div>
    <div id="chapterCard" aria-hidden="true"></div>
    <div id="depthGauge" hidden>
      <div class="dg-track"><i class="dg-mark" style="top:0%"></i><i class="dg-band" style="top:51.4%;height:35.5%"></i><i class="dg-now"></i></div>
      <div class="dg-ticks"><span style="top:0%">0</span><span style="top:51.4%">1,450</span><span style="top:86.9%">2,450</span><span style="top:100%">2,820</span></div>
      <output class="dg-value"></output>
    </div>
    <div id="overlayProcess" class="overlay" hidden></div>
    <div id="overlayMessengers" class="overlay" hidden></div>
    <div id="overlaySky" class="overlay" hidden><div class="overlay-head"></div><div class="skymap-host"></div><p class="overlay-note"></p></div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-title" data-t="meta.title"></span>
        <span class="brand-chapter"></span>
      </div>
      <nav class="actions" aria-label="settings">
        <button type="button" id="btnVoice" class="chip" aria-pressed="true"></button>
        <button type="button" id="btnVolume" class="chip" aria-expanded="false" aria-controls="volumePanel"></button>
        <button type="button" id="btnQuality" class="chip"></button>
        <button type="button" id="btnSize" class="chip" aria-pressed="false"></button>
        <button type="button" id="btnLab" class="chip"></button>
        <button type="button" id="btnSound" class="chip" aria-pressed="false"></button>
        <button type="button" id="btnLang" class="chip"></button>
        <button type="button" id="btnSources" class="chip icon" aria-label="sources">i</button>
      </nav>
    </header>
    <div id="volumePanel" class="vol-panel" role="group" hidden>
      <label><span data-t="ui.volVoice"></span><input type="range" id="volVoice" min="0" max="100" step="1" /><output></output></label>
      <label><span data-t="ui.volMusic"></span><input type="range" id="volMusic" min="0" max="100" step="1" /><output></output></label>
    </div>

    <aside id="inspector" class="panel" hidden aria-live="polite"></aside>
    <aside id="gamePanel" class="panel" hidden></aside>
    <aside id="labPanel" class="panel" hidden></aside>

    <div id="hudLeft">
      <div id="layers" hidden role="group">
        <span class="hud-title"></span>
        <button type="button" data-layer="physics" aria-pressed="true"></button>
        <button type="button" data-layer="record" aria-pressed="true"></button>
        <button type="button" data-layer="reco" aria-pressed="false"></button>
      </div>
      <div id="legend" hidden></div>
    </div>

    <div id="physTime" hidden>
      <button type="button" class="step" data-step="-100">−</button>
      <input type="range" min="-1400" max="6000" step="1" aria-label="physical time" />
      <button type="button" class="step" data-step="100">+</button>
      <output class="pt-value"></output>
      <span class="pt-rate"></span>
    </div>

    <div id="subtitles" aria-live="polite"></div>
    <div id="catDock"><yeoman-cat id="cat" sticker size="118" bubble="right"></yeoman-cat></div>

    <footer id="controls">
      <button type="button" id="btnPlay" class="play" aria-label="play"><span class="i-play"></span></button>
      <div id="timeline" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="tl-segs"></div>
        <div class="tl-fill"></div>
        <div class="tl-knob"></div>
      </div>
      <span id="clock">0:00</span>
      <button type="button" id="btnResume" class="chip accent" hidden></button>
    </footer>

    <section id="startScreen">
      <div class="start-inner">
        <p class="nobel"><span class="nobel-badge">Nobel 2026</span><span class="nobel-text"></span> <a class="nobel-link" target="_blank" rel="noopener"></a></p>
        <h1><span class="t-cn" data-t="meta.title"></span></h1>
        <p class="tagline" data-t="meta.tagline"></p>
        <p class="question" data-t="meta.question"></p>
        <div class="start-actions">
          <button type="button" id="btnStart" class="cta" data-t="meta.start"></button>
          <button type="button" id="btnExplore" class="chip ghost" data-t="meta.explore"></button>
          <button type="button" id="btnLangStart" class="chip ghost"></button>
        </div>
        <p class="fine" data-t="meta.duration"></p>
        <p class="fine dim" data-t="meta.teaching"></p>
        <p class="signature"><span class="sig-script">Yeoman</span><span data-t="meta.by"></span></p>
      </div>
    </section>

    <section id="endScreen" hidden>
      <div class="end-inner">
        <h2 data-t="end.title"></h2>
        <ul class="end-lines"></ul>
        <div class="start-actions">
          <button type="button" id="btnAgain" class="cta" data-t="end.again"></button>
          <button type="button" id="btnEndLab" class="chip ghost" data-t="end.lab"></button>
          <button type="button" id="btnEndFree" class="chip ghost" data-t="end.free"></button>
        </div>
        <p class="fine nobel-end"></p>
        <p class="signature"><span class="sig-script">Yeoman</span><span data-t="meta.by"></span></p>
      </div>
    </section>

    <dialog id="sourcesDialog">
      <form method="dialog"><button class="close" aria-label="close">×</button></form>
      <div class="dialog-body"></div>
    </dialog>

    <div id="fallback" hidden></div>
  </div>
  <noscript>这个页面需要 JavaScript 才能运行。This page needs JavaScript.</noscript>
  <script type="module" src="./shared/yeoman/yeoman-cat.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
